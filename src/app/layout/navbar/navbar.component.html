<nav [class]="'fixed top-0 left-0 right-0 z-50 transition-all duration-300 ' + (isScrolled ? 'bg-black/80 backdrop-blur-md border-b border-white/10' : 'bg-transparent')">
  <div class="container mx-auto px-6 py-4">
    <div class="flex items-center justify-between">
      <!-- Logo -->
      <div class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
        Portfolio
      </div>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        <ul class="flex space-x-8">
          <li *ngFor="let item of navItems">
            <a (click)="scrollToSection(item.href)" 
               class="text-gray-300 hover:text-white transition-colors duration-200 cursor-pointer relative after:content-[''] after:absolute after:w-full after:scale-x-0 after:h-0.5 after:bottom-0 after:left-0 after:bg-blue-400 after:origin-bottom-right after:transition-transform after:duration-300 hover:after:scale-x-100 hover:after:origin-bottom-left">
              {{item.label}}
            </a>
          </li>
        </ul>
        <a href="#" class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-6 py-2 rounded-full hover:from-blue-600 hover:to-purple-700 transition-all duration-200 font-medium">
          CV
        </a>
      </div>

      <!-- Mobile menu button -->
      <button (click)="toggleMobileMenu()" class="md:hidden text-white focus:outline-none">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <div [class]="'md:hidden overflow-hidden transition-all duration-300 ' + (isMobileMenuOpen ? 'max-h-64 opacity-100' : 'max-h-0 opacity-0')">
      <div class="pt-4 pb-2 space-y-2">
        <a *ngFor="let item of navItems" 
           (click)="scrollToSection(item.href)"
           class="block px-3 py-2 text-gray-300 hover:text-white transition-colors cursor-pointer">
          {{item.label}}
        </a>
        <a href="#" class="block px-3 py-2 text-blue-400 hover:text-blue-300 transition-colors font-medium">
          Télécharger CV
        </a>
      </div>
    </div>
  </div>
</nav>
